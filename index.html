<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGPU Menger Sponge</title>
  <meta name="description" content="Interactive WebGPU Menger Sponge raymarcher with FPS camera." />

  <style>
    :root { color-scheme: dark; background: #060b16; }

    html, body {
      margin: 0; width: 100%; height: 100%;
      overflow: hidden; background: #060b16;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    #canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%; display: block;
      cursor: crosshair;
    }

    #status {
      position: fixed; left: 12px; top: 12px; z-index: 5;
      padding: 6px 10px; color: #b7c7f7;
      background: rgba(8,12,24,0.7);
      border: 1px solid rgba(123,155,255,0.28);
      border-radius: 8px; font-size: 12px;
      pointer-events: none; user-select: none;
    }

    #fps {
      position: fixed; right: 12px; top: 12px; z-index: 5;
      padding: 4px 10px;
      color: #7effa0;
      background: rgba(8,12,24,0.72);
      border: 1px solid rgba(80,220,120,0.28);
      border-radius: 8px; font-size: 13px; font-weight: 600;
      letter-spacing: 0.03em;
      pointer-events: none; user-select: none;
      transition: color 0.4s;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="status">Initializing...</div>
  <div id="fps">-- fps</div>
  <script type="module" src="main.js"></script>
</body>
</html>
